name: Deploy to Google Play Store

on:
  push:
    tags:
      - 'v*.*.*'   # v1.0.0 のような形式のタグで発火
  workflow_dispatch:  # 手動実行も可能にしておく

jobs:
  deploy:
    name: Build & Upload to Play Store (internal)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # Keystore を Base64 デコードしてファイルに書き出す
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/release.keystore

      # google-services.json を Base64 デコードしてファイルに書き出す
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > ${{ github.workspace }}/app/google-services.json

      # local.properties に署名情報と API キーを書き込む
      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          KEYSTORE_PATH=${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # Google Play にアップロード
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: jp.co.rssh_jp.healthcareap
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          # 必要に応じてリリースノートを追加（省略可）
          # releaseName: ${{ github.ref_name }}
